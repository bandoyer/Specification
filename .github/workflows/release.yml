name: Release to NuGet

# Publishing a GitHub release builds, tests and packs the packages, then pushes them to nuget.org.
# The push uses NuGet trusted publishing: nuget.org trades this job's GitHub OIDC token for an API key
# that lasts an hour, so the repo stores no NuGet key. The nuget.org policy names this repo and this file,
# release.yml, and the repo variable NUGET_USER holds the nuget.org username that owns the packages.
# Running the workflow by hand does everything but the push, and keeps the packages as a run artifact.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.x
    - name: Build
      run: dotnet build ci.slnf --configuration Release
    - name: Test
      run: dotnet test ci.slnf --configuration Release --no-build --no-restore --framework net9.0
    - name: Pack
      run: dotnet pack ci.slnf --configuration Release --no-build --no-restore --output packages
    - name: Keep the packages
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: packages/
    - name: NuGet login
      if: github.event_name == 'release'
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ vars.NUGET_USER }}
    - name: Push to NuGet
      if: github.event_name == 'release'
      run: dotnet nuget push "packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
