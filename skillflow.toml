[pr]
# GitHub Actions has never run on this fork, so bin/pr-suite runs the suite from a fresh clone of the PR merged with main.
checks = "local"
# The same build and tests as upstream's ci.yml. The SQL Server is the spec-sql container from CONTRIBUTING.md's "Running
# the tests". Runs share it and each test run resets the same databases, so the tests wait for AGENTS.md's lock. Then the
# verify skill's helper tests, which a later edit to the helper would otherwise slip past.
suite = '''
set -eu
export SPECIFICATION_TEST_SQL_SERVER='Server=localhost,1433;User Id=sa;Password=P@ssW0rd!;TrustServerCertificate=True'
echo "=== dotnet build ci.slnf --configuration Release"; dotnet build ci.slnf --configuration Release
echo "=== dotnet test ci.slnf --framework net9.0"
flock "$HOME/.cache/specification-spec-sql.lock" dotnet test ci.slnf --configuration Release --no-build --framework net9.0
for test in .agents/skills/verify-specification/tests/*.sh; do echo "=== $test"; "$test"; done
'''

# The chief's policy: what /skillflow chief answers from, merges, and leaves to Dan. skillflow's references/chief.md
# reads it. Drafted on 2026-10-30 for the EF6 provider issues #3, #4, #6, #7 and #10, and extended the same day for
# Epic #9's #8 and #11, the issues #22, #23, #28, #34 and #39 the runs and the chief filed, and #16 and #18. Extended
# on 2026-11-01 for #47, the rename to OpenSpecification.
[chief]
sources = [
  "Issues #3, #4, #6, #7 and #10, copied from ardalis/Specification #521, #522, #533, #534 and #537",
  "Issues #8 and #11, copied from ardalis/Specification #535 and #538, and issues #22, #23, #28, #34 and #39",
  "Issues #16 and #18, copied from ardalis/Specification #546 and #550",
  "Issue #47, the rename to OpenSpecification (Dan, 2026-11-01)",
  "Epic #9, which plans #3, #4, #6, #7, #8, #10 and #11 for version 10.0.0",
  "Dan's aim (2026-10-30): a maintained fork that professionals can rely on as they relied on upstream, so a copied issue follows what its upstream author wrote",
  "src/OpenSpecification.EntityFrameworkCore, the reference implementation (Dan, 2026-10-30)",
  "The tests Fati Iseni skipped for #3 and #4, in tests/OpenSpecification.EntityFramework6.Tests/Evaluators/",
  "CONTRIBUTING.md and AGENTS.md",
]
merge = "Verify passed at a commit skillflow check still holds to the PR head, no Act on finding is open in review.md, the suite passed from a fresh clone of the head merged with the default branch as it is now (artifacts/pr-suite.txt), GitHub says the PR can merge, and the diff matches the sources."
never-delegate = [
  "Posting anything outside bandoyer/OpenSpecification, such as an issue, comment or pull request on ardalis/Specification.",
  "Publishing a release or a NuGet package, or changing a package's version.",
  "A public API change that the standing answer public-api doesn't cover.",
]
stop = [
  "The spec-sql container isn't running: `docker ps --filter name=spec-sql --filter status=running -q` prints nothing.",
]

[chief.standing]
ci = "Declined: GitHub Actions has never run on this fork. [pr] sets checks = \"local\", and bin/pr-suite runs the suite."
reference = "Port the EF Core provider's evaluator to EF6: its shape, its names, its OneOrMany fast paths and its cached delegates. Depart only where EF6's API differs, such as string Include paths in place of ThenInclude, and list each departure in the PR body."
public-api = "Epic #9 plans its issues for version 10.0.0, so a breaking change that gives the EF6 provider the EF Core provider's public shape, or that the standing answers query-member and dbset-extensions describe, is expected. One example is IncludeEvaluator no longer applying include strings once IncludeStringEvaluator does. So is #39's fix (Dan, 2026-10-30): ContextFactoryRepositoryBase<TEntity, TContext>.SingleOrDefaultAsync throws for two matches, as RepositoryBase<T>.SingleOrDefaultAsync does. So is #16's new method (Dan, 2026-10-30): IReadRepositoryBase<T> gains an AsAsyncEnumerable overload that takes ISpecification<T, TResult> and returns IAsyncEnumerable<TResult>, inside the entity overload's #if NET8_0_OR_GREATER. Each repository base that implements the interface gains it, and so do the EF Core provider's DbSetExtensions. EF6's RepositoryBase<T> throws NotImplementedException from it, as it does from the entity overload, since EF6 has no async streams. The PR body lists, under a \"Breaking\" heading, each public type or member the PR removes or changes and each behaviour a caller can see change. The standing answer changelog says where their release notes go. Any other public change goes to Dan."
skipped-tests = "Enable each test the issue's author skipped, as written. When EF6 can't produce the SQL the test expects, change the expectation only as far as EF6 forces, and say why in the PR body."
net472 = "Declined as a gate: the suite builds every target framework, net472 included, and runs the tests on net9.0, as upstream's ci.yml does."
performance = "Dan's rule for performance work holds for #7 and for the 'optimize the evaluator' in #3, #4 and #6: run the same BenchmarkDotNet workload, with MemoryDiagnoser, on the evaluator's GetQuery before and after the change, keep the benchmark in the run folder, and put both results in the PR body. tests/OpenSpecification.Benchmarks stays EF Core only."
query-member = "Dan, 2026-10-30, for #8: remove Query from ISpecification<T> and ISpecification<T, TResult>, and keep it on Specification<T> and Specification<T, TResult>, with XML docs of their own in place of <inheritdoc/>. ISpecification<T> itself stays. The release note's fix for a caller is to use the concrete class."
dbset-extensions = "Dan, 2026-10-30, for #11: in both providers' DbSetExtensions, add FirstOrDefaultAsync, SingleOrDefaultAsync, CountAsync and AnyAsync, and AsAsyncEnumerable in EF Core only, as extensions of DbSet<T> that take ISpecification<T>. SingleOrDefaultAsync takes ISingleResultSpecification<T>. FirstOrDefaultAsync and SingleOrDefaultAsync get TResult overloads, and so do the existing ToListAsync and ToEnumerableAsync. Each applies the spec as the repository's method of the same name does: CountAsync and AnyAsync evaluate the criteria only, and ToListAsync applies the post-processing action. No evaluator parameter, since WithSpecification takes one. EF6 has no AsAsyncEnumerable, the departure the PR body lists. Update the docs page on using a specification with a DbContext."
filed-issues = "Dan, 2026-10-30: a bug a run files joins the queue when it is in a file that a run in the queue lists on its Files: line or changes in its PR. It goes in the lane whose files it shares. Any other filed issue, such as a feature, a refactor, or a bug in a file no run in the queue touched, goes to Dan."
changelog = "Dan, 2026-10-30: a PR that changes what a package user sees adds its own release notes to CHANGELOG.md, in the top section marked \"(unreleased)\", now \"10.0.0 (unreleased)\". When no section is marked that way, the PR adds \"## Unreleased\" above the newest release. A breaking change goes under \"Breaking changes\" and its package's heading, and says what a caller changes. Any other change a package user can see goes under \"Other changes\". Each entry ends with a link to the issue the PR fixes, since the PR's number doesn't exist until the PR opens. A PR that changes only the docs, the agent skills, skillflow.toml or test setup adds none."
rename = "Dan, 2026-11-01, for #47: \"Yes, let's do the full rename so there is no longer a connection to Ardalis.\" The package ids, assembly names, root namespaces, project folders and project files become OpenSpecification, OpenSpecification.EntityFrameworkCore and OpenSpecification.EntityFramework6. The tests, benchmarks and samples follow, such as OpenSpecification.Tests and OpenSpecification.Sample.App1, and the solution becomes OpenSpecification.sln. Every package's version becomes 10.0.0. The package metadata names Dan Boyer as author and copyright holder, and its project and repository URLs are https://github.com/bandoyer/OpenSpecification, the repo's new name. The packages ship no icon until Dan picks one, since icon.png and docs/favicon.ico are the Ardalis logo. The docs drop docs/CNAME, the Ardalis links and promotions, and anything that presents Steve Smith or ardalis.com as the maintainer. LICENSE keeps the line \"Copyright (c) 2025 Steve Smith\", which the MIT license requires, and adds one for Dan Boyer. CHANGELOG.md's 10.0.0 section opens with the rename and its migration: swap the package reference, then replace Ardalis.Specification with OpenSpecification in using directives. The release notes of 9.x and older stay as they were written, and so do the run records under .skillflow/. Links to upstream issues stay where they cite where an issue came from. The rename changes no other public API, and the PR body lists it under Breaking."
post-processing = "Dan, 2026-10-30, for #18: only the methods that return a list apply PostProcessingAction. These are ListAsync, the DbSet extensions ToListAsync and ToEnumerableAsync, and InMemorySpecificationEvaluator.Evaluate. CountAsync, AnyAsync, FirstOrDefaultAsync, SingleOrDefaultAsync and AsAsyncEnumerable ignore it, and so does #16's AsAsyncEnumerable overload. CountAsync and AnyAsync evaluate the criteria only, in SQL. Declined: making CountAsync apply it, which would load every matching row to count them. Upstream's ardalis/Specification #134 called criteria-only counting intended, and its maintainer chose to document the behaviour on #550. The PostProcessingAction docs page says which methods apply it."
